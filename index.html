<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XzenXOS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #f4f4ff;
            background: #10101c;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;

        }

        .welcome {
            width: 100%;
            max-width: 760px;
            padding: 40px;
            border: 1px solid #393950;
            border-radius: 20px;
            background: #1b1b2b;
            box-shadow: 0 20px 60px #0005;
        }

        .status {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            background: #252c42;
            color: #9ce6c0;
            font-size: 12px;
        }

        h1 {
            margin: 22px 0 8px;
            font-size: clamp(36px, 7vw, 58px);
            letter-spacing: -2px;
        }

        h1 span {
            color: #a99bff;
        
        }

        .intro {
            color: #bcbcd0;
            line-height: 1.7;
            max-width: 560px;
        }

        .section-title {
            margin-top: 32px;
            font-size: 14px;
            color: #a99bff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }




    </style>
</head>

<body>
    <main class="welcome">
        <span class="status">SYSTEM INITIALIZED</span>

        <h1>welcome to <span>XzenXOS</span></h1>

        <p class="intro"> 
            Welcome to my first browser based OS
        </p>

        <h2 class="section-title">About me</h2>
        <p class="intro">
            i am just learning coding, RE etc
        </p>

    </main>
</body>
</html>
