<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XzenXOS</title>

<link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="top-bar">
        <p class="os-name">XzenXOS</p>
        <p id="timeElement">Loading time..</p>
    </div>

    <main class="welcome">
        <span class="status">SYSTEM INITIALIZED</span>

        <h1>Welcome to <span>XzenXOS</span></h1>

        <p class="intro">
            It is a simple browser based OS built with HTMl and CSS.
        </p>
    </main>

    <script>
        function updateTime() {
            var currentTime = new Date().toLocaleString();
            var timeText = document.querySelector("#timeElement");
            timeText.innerHTML = currentTime;
        }

        updateTime();
        setInterval(updateTime, 1000);

    </script>
</body>
</html>
